<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liste bereinigen</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
      }

      textarea {
        width: 100%;
        height: 300px;
        box-sizing: border-box;
        margin-bottom: 15px;
        padding: 10px;
        font-family: monospace;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Liste bereinigen</h1>

    <textarea
      id="input"
      placeholder="Liste zur Bereinigung einfügen. Doppelte Einträge und Leerzeilen werden entfernt."
    ></textarea>

    <button onclick="bereinigen()">Bereinigen</button>

    <script>
      function bereinigen() {
        const textarea = document.getElementById("input");

        const zeilen = textarea.value
          .split(/\r?\n/)
          .map((zeile) => zeile.trim())
          .filter((zeile) => zeile !== "");

        const eindeutigeZeilen = [...new Set(zeilen)];

        textarea.value = eindeutigeZeilen.join("\n");
      }
    </script>
  </body>
</html>
